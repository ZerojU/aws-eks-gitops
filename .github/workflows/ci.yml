
name: Build and Push to ECR

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecr-push-${{ github.sha }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: aws-eks-gitops-project-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 소스코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3.12 환경 준비
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      # 3. 의존성 설치
      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install -r requirements-dev.txt

      # 4. 테스트 실행
      - name: Run all tests
        working-directory: ./app
        run: |
          python -m pytest -v

      # 5. OIDC로 AWS IAM Role 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-ci-ecr-push

      # 6. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. 이미지 태그 중복 여부 확인
      - name: Check existing image
        id: image-check
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists. Skipping push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 8. Docker 이미지 빌드
      - name: Build Docker image
        if: steps.image-check.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            --build-arg GIT_COMMIT="$IMAGE_TAG" \
            -t "$IMAGE_URI" \
            ./app

      # 9. ECR 이미지 Push
      - name: Push Docker image
        if: steps.image-check.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$IMAGE_URI"

      # 10. 최종 이미지 검증
      - name: Verify pushed image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].{Tags:imageTags,Digest:imageDigest}' \
            --output json
