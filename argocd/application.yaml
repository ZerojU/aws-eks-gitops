apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: project-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ZerojU/aws-eks-gitops.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: project

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
